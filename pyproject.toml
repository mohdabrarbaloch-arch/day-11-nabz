[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented pattern

[tool.ruff.lint.per-file-ignores]
# Test factories build kwargs dicts on purpose so overrides can be merged in.
"tests/*" = ["S101", "C408"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
